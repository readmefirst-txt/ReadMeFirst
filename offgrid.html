<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEAD INTERNET // OFFGRID</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --amber-bright: #ffb100;
            --amber-dim: #a67300;
            --amber-faded: rgba(255, 177, 0, 0.4);
            --amber-glow: rgba(255, 177, 0, 0.3);
            --bg: #050300;
            --box-bg: rgba(10, 5, 0, 0.4);
            --screen-curve: perspective(1000px) rotateX(1deg) rotateY(0deg) scale(0.98);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000;
            color: var(--amber-bright);
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* RTL FIX */
        [data-rtl="true"] {
            direction: rtl;
            text-align: right;
        }

        /* CRT TUBE SIMULATION */
        #crt-container {
            width: 100%;
            height: 100%;
            max-width: 1100px;
            max-height: 900px;
            background: var(--bg);
            border: 8px solid #000;
            border-radius: 40px;
            position: relative;
            transform: var(--screen-curve);
            box-shadow: 0 0 100px rgba(0, 0, 0, 1), inset 0 0 80px rgba(255, 136, 0, 0.15);
            display: flex;
            flex-direction: column;
            padding: 20px 30px;
            gap: 12px;
            /* Subtle breathing glow */
            animation: crt-pulse 6s infinite alternate;
        }

        /* OVERLAYS (Scanlines + vignette) */
        #crt-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        #crt-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0, 0, 0, 0.5) 100%);
            z-index: 11;
            pointer-events: none;
            box-shadow: inset 0 0 20px rgba(255, 177, 0, 0.05);
        }

        @keyframes crt-pulse {
            0% {
                box-shadow: 0 0 100px rgba(0, 0, 0, 1), inset 0 0 60px rgba(255, 136, 0, 0.08);
            }

            100% {
                box-shadow: 0 0 100px rgba(0, 0, 0, 1), inset 0 0 100px rgba(255, 136, 0, 0.18);
            }
        }

        /* GRID SYSTEM */
        .grid-row {
            display: flex;
            gap: 12px;
            width: 100%;
            flex-shrink: 0;
        }

        .box {
            border: 2px solid var(--amber-dim);
            background: var(--box-bg);
            padding: 8px 15px;
            /* SHRUNK VERTICAL PADDING */
            position: relative;
            z-index: 2;
        }


        /* ROW 1: THE CLOCK & METRICS */
        .clock-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 2px solid var(--amber-bright);
            box-shadow: inset 0 0 15px rgba(255, 177, 0, 0.1);
            padding: 5px;
            /* TIGHT PADDING */
        }

        .clock-title {
            font-size: 0.9rem;
            /* SHRUNK */
            color: var(--amber-dim);
            letter-spacing: 3px;
        }

        .t-minus {
            font-size: 2.2rem;
            /* REDUCED MAIN CLOCK FONT */
            font-weight: bold;
            color: var(--amber-bright);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--amber-glow);
            animation: slow-pulse 2s infinite alternate;
        }

        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-box {
            background: var(--box-bg);
            border: 1px solid var(--amber-bright);
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 20px var(--amber-glow);
        }

        .auth-box input {
            width: 100%;
            background: #000;
            border: 1px solid var(--amber-dim);
            color: var(--amber-bright);
            padding: 12px;
            margin-bottom: 10px;
            font-family: inherit;
            outline: none;
            text-align: center;
            letter-spacing: 3px;
        }

        .auth-box button {
            width: 100%;
            padding: 15px;
            background: var(--amber-bright);
            color: #000;
            border: none;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }

        #crt-container {
            display: none;
        }


        .t-minus span {
            font-size: 1.2rem;
            color: var(--amber-dim);
        }

        @keyframes slow-pulse {
            from {
                text-shadow: 0 0 5px var(--amber-glow);
            }

            to {
                text-shadow: 0 0 20px var(--amber-bright);
            }
        }

        .metrics-sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }

        .m-item {
            font-size: 1rem;
            color: var(--amber-bright);
        }

        .m-title-text {
            color: var(--amber-dim);
            font-size: 0.85rem;
        }

        .m-value {
            color: var(--amber-bright);
            text-shadow: 0 0 3px var(--amber-glow);
            font-weight: bold;
        }

        /* ROW 2: FULL WIDTH MAIN STORY CONSOLE */
        .console-container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            border: 2px solid var(--amber-dim);
            background: var(--box-bg);
            z-index: 2;
            min-height: 400px;
            position: relative;
        }

        .special-window {
            border-color: var(--amber-bright) !important;
            box-shadow: 0 0 20px var(--amber-glow);
        }

        .special-window .ch-btn.active {
            color: #000 !important;
            border-bottom-color: var(--amber-bright) !important;
            background: var(--amber-bright) !important;
        }

        .objective-header {
            background: var(--amber-bright);
            color: #000;
            font-size: 11px;
            font-weight: 900;
            padding: 8px 15px;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            width: 100%;
            box-sizing: border-box;
            border-bottom: 2px solid #000;
        }

        .bot-check-container {
            background: var(--amber-bright);
            color: #000;
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
            flex-grow: 1;
        }

        .bot-check-btn {
            background: #000;
            color: var(--amber-bright);
            border: 1px solid var(--amber-bright);
            padding: 12px 30px;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 10px rgba(255, 177, 0, 0.2);
            overflow: hidden;
        }

        .bot-check-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 177, 0, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .bot-check-btn:hover::before {
            left: 100%;
        }

        .bot-check-btn:hover {
            box-shadow: 0 0 20px var(--amber-glow);
            transform: translateY(-2px);
            background: rgba(255, 177, 0, 0.05);
        }

        .bot-check-btn:active {
            transform: scale(0.95);
        }

        #nav-header {
            display: flex;
            border-bottom: 2px solid var(--amber-dim);
            background: rgba(0, 0, 0, 0.5);
        }

        .ch-btn {
            flex: 1;
            padding: 8px 5px;
            text-align: center;
            border-right: 2px solid var(--amber-dim);
            cursor: pointer;
            color: var(--amber-dim);
            transition: all 0.2s;
            font-size: 1.1rem;
            letter-spacing: 1px;
            background: transparent;
        }

        .ch-btn:last-child {
            border-right: none;
        }

        .ch-btn:hover {
            color: var(--amber-bright);
            background: rgba(255, 177, 0, 0.1);
        }

        .ch-btn.active {
            color: #000;
            background: var(--amber-bright);
            font-weight: bold;
            text-shadow: none;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .void-box {
            flex-grow: 1;
            font-size: 1.25rem;
            overflow-y: auto;
            position: relative;
            padding: 20px 25px;
            /* SPREAD OUT TEXT */
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        .void-box::-webkit-scrollbar {
            width: 4px;
        }

        .void-box::-webkit-scrollbar-thumb {
            background: var(--amber-dim);
        }

        .void-text {
            color: var(--amber-bright);
            opacity: 0.95;
            flex-grow: 1;
        }

        /* TEXT LINKS */
        .void-text a {
            color: #000;
            background: var(--amber-bright);
            padding: 0 4px;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .void-text a:hover {
            background: var(--amber-dim);
            color: var(--amber-bright);
        }

        /* TOOLTIP STATS (RESTORED FROM INDEX) */
        .stat-item {
            border-bottom: 1px dotted var(--amber-bright);
            cursor: help;
            position: relative;
        }

        /* Wrap list items with more space to avoid tooltip overlap */
        .void-text hr+* {
            display: inline-block;
            margin-top: 15px;
        }

        .void-text br {
            line-height: 2.2;
            /* Spacing out lines heavily */
            content: " ";
            display: block;
            margin-bottom: 8px;
            /* EXTRA VERTICAL SPACE FOR STATS */
        }

        .stat-item:hover::after {
            content: attr(data-desc);
            position: absolute;
            bottom: 110%;
            /* Lifted slightly more */
            left: 0;
            background: #000;
            border: 1px solid var(--amber-bright);
            color: var(--amber-bright);
            padding: 10px;
            font-size: 1rem;
            /* Slightly larger text */
            width: 250px;
            z-index: 1000;
            line-height: 1.4;
            box-shadow: 0 0 15px var(--amber-glow);
            text-transform: none;
            /* easier to read descriptions */
            font-weight: normal;
        }

        /* EVIDENCE INPUT BAR (Persistent at bottom of console) */
        .evidence-line {
            border-top: 1px dashed var(--amber-dim);
            padding: 12px 25px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            z-index: 50;
            /* ELEVATED ABOVE CRT EFFECT SO U CAN CLICK AND TYPE */
            position: relative;
        }

        .evidence-line span {
            color: var(--amber-bright);
            font-weight: bold;
            animation: blink 1s step-end infinite;
        }

        input {
            background: transparent;
            border: none;
            color: var(--amber-bright);
            font-family: inherit;
            font-size: 1.1rem;
            outline: none;
            flex-grow: 1;
            text-transform: uppercase;
        }

        input::placeholder {
            color: var(--amber-faded);
            letter-spacing: 2px;
        }

        /* TYPEWRITER BLINKER */
        .blinker {
            display: inline-block;
            width: 10px;
            height: 1.1em;
            background: var(--amber-bright);
            animation: blink 0.8s step-end infinite;
            vertical-align: bottom;
            margin-left: 5px;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* ROW 3: BOT INTRUSION SCANNER */
        .scanner-box {
            height: 50px;
            /* SHRUNK */
            width: 100%;
            border: 1px solid var(--amber-dim);
            background: #000;
            z-index: 2;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2px 10px;
            color: var(--amber-faded);
            font-size: 0.8rem;
            line-height: 1.2;
            flex-shrink: 0;
        }

        .scan-line {
            white-space: nowrap;
        }

        .scan-alert {
            color: var(--amber-bright);
        }

        #main-title {
            width: 100%;
            height: 60px;
            /* Fixed height for consistent centering */
            border-top: 2px solid var(--amber-dim);
            border-bottom: 2px solid var(--amber-dim);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            /* Perfect vertical centering */
            justify-content: flex-end;
            position: relative;
            padding: 0;
            /* Reset padding to use height for centering */
            flex-shrink: 0;
        }

        /* Mobile Safeguard */
        #main-title>*:not(.lang-selector) {
            display: none !important;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            color: var(--amber-bright);
            padding-right: 15px;
            margin: 0;
            /* Reset margins */
        }

        .lang-selector span {
            margin: 0;
            line-height: normal;
        }

        .lang-selector select {
            background: black;
            color: var(--amber-bright);
            border: 1px solid var(--amber-dim);
            font-family: inherit;
            font-size: 1rem;
            padding: 4px 8px;
            cursor: pointer;
            outline: none;
            margin: 0;
            /* Reset margins */
            height: auto;
            line-height: normal;
        }

        select option {
            background: #000;
            color: var(--amber-bright);
        }

        /* SYSTEM LOADER */
        #system-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 20000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .loader-content {
            width: 90%;
            max-width: 400px;
        }

        .loader-title {
            font-size: 14px;
            color: var(--amber-bright);
            margin-bottom: 20px;
            letter-spacing: 4px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
        }

        .loader-bar-container {
            width: 100%;
            height: 2px;
            background: #111;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 177, 0, 0.2);
        }

        .loader-bar {
            width: 0%;
            height: 100%;
            background: var(--amber-bright);
            box-shadow: 0 0 15px var(--amber-bright);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .loader-status {
            font-size: 9px;
            color: var(--amber-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            height: 12px;
        }

        .loader-force {
            margin-top: 30px;
            background: transparent;
            border: 1px solid var(--amber-dim);
            color: var(--amber-dim);
            padding: 8px 15px;
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
            display: none;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .loader-force:hover {
            border-color: var(--amber-bright);
            color: var(--amber-bright);
            background: rgba(255, 177, 0, 0.05);
        }

        @keyframes scanline-loader {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .loader-scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(255, 177, 0, 0.1), transparent);
            animation: scanline-loader 4s linear infinite;
            pointer-events: none;
        }

        #btn-exit {
            background: transparent;
            color: var(--amber-bright);
            border: 1px dotted var(--amber-dim);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            padding: 2px 10px;
            margin-left: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            display: none;
        }

        #btn-exit:hover {
            color: #fff;
            border-color: var(--amber-bright);
            text-shadow: 0 0 10px var(--amber-bright);
            background: rgba(255, 191, 0, 0.05);
        }

        /* DUMP MODAL (YOUTUBE OVERLAY) */
        #dump-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            width: 95%;
            max-width: 900px;
            background: #000;
            border: 2px solid var(--amber-bright);
            position: relative;
            box-shadow: 0 0 50px rgba(255, 177, 0, 0.5);
        }

        .close-modal {
            position: absolute;
            top: -35px;
            right: 0;
            color: var(--amber-bright);
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--amber-dim);
            border-bottom: none;
            padding: 5px 15px;
        }

        .close-modal:hover {
            background: var(--amber-bright);
            color: #000;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .bot-check-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 400px;
            text-align: center;
            background: rgba(255, 177, 0, 0.02);
        }

        .bot-check-btn {
            background: transparent;
            color: var(--amber-bright);
            border: 1px solid var(--amber-bright);
            padding: 15px 40px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--amber-bright);
        }

        .bot-check-btn:hover {
            background: var(--amber-bright);
            color: black;
            box-shadow: 0 0 20px var(--amber-bright);
        }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                /* Left alignment */
                padding: 10px 15px;
            }

            .container {
                width: 100%;
                margin: 0;
            }

            .grid-row {
                flex-direction: column;
                gap: 8px;
            }

            .clock-container,
            .metrics-sidebar {
                width: 100%;
                flex: none;
            }

            .t-minus {
                font-size: 1.6rem;
                letter-spacing: 1px;
            }

            #nav-header {
                flex-wrap: wrap;
            }

            .ch-btn {
                flex: 1;
                width: 20%;
                border-bottom: 1px solid var(--amber-dim);
                border-right: 1px solid var(--amber-dim);
                font-size: 0.75rem;
                padding: 10px 2px;
                box-sizing: border-box;
                text-align: center;
            }

            .ch-btn:last-child {
                border-right: none;
            }

            .console-container {
                min-height: 350px;
            }

            .void-box {
                padding: 15px;
                font-size: 1.1rem;
            }

            .lang-selector {
                position: static;
                justify-content: flex-start;
                margin: 0;
                display: flex;
                width: auto;
                border: none;
                background: transparent;
                padding: 0;
            }

            .lang-selector span {
                font-size: 0.65rem;
                color: var(--amber-bright);
                opacity: 1;
                /* More visible */
            }

            .lang-selector select {
                font-size: 0.75rem;
                padding: 1px 2px;
                border-color: var(--amber-bright);
                color: var(--amber-bright);
                background: rgba(0, 0, 0, 0.8);
            }

            #main-title {
                font-size: 0.9rem;
                letter-spacing: 2px;
                padding: 5px;
                /* Reduced from 10px 5px */
                height: 40px;
                /* Reduced from 50px */
                display: flex;
                align-items: center;
                box-sizing: border-box;
                border-top: 2px solid var(--amber-dim);
                border-bottom: 2px solid var(--amber-dim);
            }

            .console-container {
                min-height: 350px;
                width: 100%;
                box-sizing: border-box;
            }
        }
            /* CENTRAL LOADER */
            .central-loader-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100%;
                min-height: 300px;
            }
            .mini-bar-container {
                width: 150px;
                height: 2px;
                background: rgba(255, 176, 0, 0.05);
                border: 1px solid rgba(255, 176, 0, 0.2);
                position: relative;
                overflow: hidden;
            }
            .mini-bar {
                width: 0%;
                height: 100%;
                background: var(--amber-bright);
                box-shadow: 0 0 10px var(--amber-glow);
                transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            /* CUSTOM SCROLLBAR FOR BROADCAST */
            #comms-list::-webkit-scrollbar {
                width: 4px;
            }
            #comms-list::-webkit-scrollbar-track {
                background: rgba(255, 176, 0, 0.05);
            }
            #comms-list::-webkit-scrollbar-thumb {
                background: var(--amber-bright);
                box-shadow: 0 0 5px var(--amber-glow);
            }
            .loader-force {
                margin-top: 20px;
                background: transparent;
                border: 1px solid var(--amber-dim);
                color: var(--amber-dim);
                padding: 5px 10px;
                font-family: inherit;
                font-size: 9px;
                cursor: pointer;
                display: none;
                text-transform: uppercase;
                transition: all 0.3s;
            }
            .loader-force:hover {
                border-color: var(--amber-bright);
                color: var(--amber-bright);
            }
    </style>
</head>

<body>


    <!-- YOUTUBE DUMP MODAL -->

        window.onload = () => {
            const bLang = navigator.language.split('-')[0];
            currentLang = localStorage.getItem('pref_lang') || (translations[bLang] ? bLang : 'es');

            document.getElementById('lang-sel').value = currentLang;

            // Automatic Language by IP

            setLang(currentLang);
            startCentralLoading();
        };
    </script>
    <script src="https://readmefirst-server.onrender.com/socket.io/socket.io.js"></script>
    <script src="https://readmefirst-server.onrender.com/analytics.js"></script>
    <script>
        (function () {
            const socketHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? '' : "https://readmefirst-server.onrender.com";
            
            window.startCentralLoading = function() {
                const body = document.getElementById('console-body');
                if (!body) return;
                body.innerHTML = `
                    <div class="central-loader-container">
                        <div class="mini-bar-container">
                            <div class="mini-bar" id="central-bar"></div>
                        </div>
                        <button class="loader-force" id="central-force" onclick="window.finishLoading()">[ BYPASS ]</button>
                    </div>
                `;
                
                let progress = 0;
                window.centralInterval = setInterval(() => {
                    if (progress < 95) {
                        progress += (95 - progress) * 0.05;
                        const bar = document.getElementById('central-bar');
                        if (bar) bar.style.width = progress + '%';
                    }
                }, 400);

                setTimeout(() => {
                    const btn = document.getElementById('central-force');
                    if (btn) btn.style.display = 'block';
                }, 8000);
            };

            window.finishLoading = function() {
                clearInterval(window.centralInterval);
                const bar = document.getElementById('central-bar');
                if (bar) bar.style.width = '100%';
                setTimeout(() => {
                    setTab(0);
                }, 300);
            };

            const socket = io(socketHost);

            // Automatic Language by IP (Region Detection)
            if (window.AntigravityGeo) {
                window.AntigravityGeo.onDetected = (region) => {
                    if (localStorage.getItem('pref_lang')) return;
                    const regionMap = {
                        'Spain': 'es', 'Mexico': 'es', 'Argentina': 'es', 'Colombia': 'es', 'Chile': 'es',
                        'United States': 'en', 'United Kingdom': 'en', 'Canada': 'en',
                        'Brazil': 'pt', 'Portugal': 'pt',
                        'France': 'fr', 'Germany': 'de', 'Japan': 'ja', 'China': 'zh', 'Russia': 'ru'
                    };
                    const detected = regionMap[region];
                    if (detected && detected !== window.currentLang) {
                        setLang(detected);
                        document.getElementById('lang-sel').value = detected;
                    }
                };
            }

            socket.on('connect', () => {
                console.log('Connected to backend');
                clearInterval(window.centralInterval);
                window.finishLoading();
            });

            let msgHistory = JSON.parse(localStorage.getItem('broadcast_history_offgrid') || '[]');

            function renderMessages() {
                const list = document.getElementById('comms-list');
                const box = document.getElementById('comms-box');
                if (!list || !box) return;

                if (msgHistory.length > 0) box.style.display = 'block';
                else box.style.display = 'none';
                list.innerHTML = '';

                msgHistory.forEach((data, index) => {
                    const item = document.createElement('div');
                    item.style.width = '100%';
                    if (index < msgHistory.length - 1) {
                        item.style.marginBottom = '10px';
                        item.style.paddingBottom = '10px';
                        item.style.borderBottom = '1px solid rgba(255,177,0,0.1)';
                    }

                    const pay = document.createElement('div');
                    pay.style.color = '#fff';
                    pay.style.fontSize = '1.1rem';
                    pay.style.marginBottom = '5px';
                    pay.innerText = data.message;

                    const met = document.createElement('div');
                    met.style.fontSize = '0.9rem';
                    met.style.color = 'var(--amber-dim)';
                    met.innerText = (data.isNew ? 'RECV: ' : 'LAST: ') + new Date(data.timestamp).toLocaleString();

                    item.appendChild(pay);
                    item.appendChild(met);
                    list.appendChild(item);
                });

                list.scrollTop = list.scrollHeight;
            }

            // Initial render
            renderMessages();

            socket.on('new_broadcast', (data) => {
                if (data.protocol === 'all' || data.protocol === 'horror') {
                    data.isNew = true;
                    msgHistory.push(data);
                    if (msgHistory.length > 5) msgHistory.shift();
                    localStorage.setItem('broadcast_history_offgrid', JSON.stringify(msgHistory));
                    renderMessages();
                }
            });

            socket.on('history', (list) => {
                const relevant = list.filter(d => d.protocol === 'all' || d.protocol === 'horror');
                if (relevant.length > 0) {
                    msgHistory = relevant.slice(-5).map(m => ({ ...m, isNew: false }));
                    localStorage.setItem('broadcast_history_offgrid', JSON.stringify(msgHistory));
                    renderMessages();
                }
            });

            socket.on('clear_broadcasts', () => {
                msgHistory = [];
                localStorage.removeItem('broadcast_history_offgrid');
                const box = document.getElementById('comms-box');
                if (box) box.style.display = 'none';
                renderMessages();
            });

            socket.on('clear_broadcasts', () => {
                msgHistory = [];
                const box = document.getElementById('comms-box');
                if (box) box.style.display = 'none';
                renderMessages();
            });
        })();
    </script>
</body>

</html>
