            --box-bg: #050505;
            --text: #00ff41;
            --border: #006600;
            --accent-red: #00ff41;

            --accent-green: #00ff41;
            --label: #00aa00;
            --switch-bg: #111;
            --glow: 0 0 10px rgba(0, 255, 65, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(var(--grid) 1px, transparent 1px);
            background-size: 30px 30px;
            padding: 10px;
            overflow-x: hidden;
        }

        /* CRT Scanlines Overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 9999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        @keyframes flicker {
            0% {
                opacity: 0.97;
            }

            5% {
                opacity: 0.95;
            }

            10% {
                opacity: 0.9;
            }

            15% {
                opacity: 0.95;
            }

            30% {
                opacity: 0.98;
            }

            50% {
                opacity: 0.94;
            }

            80% {
                opacity: 0.99;
            }

            100% {
                opacity: 0.96;
            }
        }

            text-transform: uppercase;
            font-weight: bold;
            padding: 5px 10px;

            font-family: inherit;
            font-size: 9px;
            cursor: pointer;

            border: 1px solid var(--border);
            margin-bottom: 12px;
            width: 100%;
            box-shadow: inset 0 0 15px rgba(0, 255, 65, 0.05);

            background: var(--switch-bg);
            overflow-x: auto;

            color: var(--label);

            text-transform: uppercase;

            text-shadow: var(--glow);

            color: var(--label);
            padding: 8px 15px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);

            line-height: 1.6;
            font-size: 13px;
            overflow-y: auto;

                const d = Math.floor(diff / 86400000).toString().padStart(3, '0');
                const h = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('t-minus').innerText = `${d}d:${h}h:${m}m:${s}s`;
            } else {
                document.getElementById('t-minus').innerText = "000d:00h:00m:00s";
            }

            let currentPercent = 50.0;
            if (now >= targetDate) {
                currentPercent = 72.4;
            } else if (now > startDate) {
                const totalDuration = targetDate - startDate;
                const elapsed = now - startDate;
                const progress = elapsed / totalDuration;
                currentPercent = 50.0 + (progress * (72.4 - 50.0));
            }
            currentPercent += (Math.random() * 0.005);
            document.getElementById('saturacion').innerText = currentPercent.toFixed(6) + "%";
        }, 1000);
        const bLang = navigator.language.split('-')[0];
        currentLang = translations[bLang] ? bLang : 'es';

        window.addEventListener('load', () => {
            if (localStorage.getItem('antigravity_auth') !== 'true') {
                window.location.href = 'index.html';
            } else {
                setLang(currentLang, document.getElementById(`btn-${currentLang}`));
                setTab(0); // Force README tab on start
            }
        });
    </script>
    <script src="https://readmefirst-server.onrender.com/socket.io/socket.io.js"></script>
    <script>
        (function () {
            const socket = io("https://readmefirst-server.onrender.com");
            let msgHistory = [];

            function renderMessages() {
                const list = document.getElementById('broadcast-list');
                const box = document.getElementById('broadcast-box');
                if (!list || !box) return;

                if (msgHistory.length > 0) box.style.display = 'block';
                list.innerHTML = '';

                msgHistory.forEach((data, index) => {
                    const item = document.createElement('div');
                    item.style.marginBottom = '10px';
                    item.style.paddingBottom = '10px';
                    if (index < msgHistory.length - 1) item.style.borderBottom = '1px solid rgba(0,255,65,0.1)';

                    const pay = document.createElement('div');
                    pay.style.color = '#fff';
                    pay.style.fontSize = '1rem';
                    pay.style.marginBottom = '5px';
                    pay.innerText = data.message;

                    const met = document.createElement('div');
                    met.style.fontSize = '9px';
                    met.style.color = 'var(--label)';
                    met.innerText = (data.isNew ? 'RECV: ' : 'LAST: ') + new Date(data.timestamp).toLocaleString();

                    item.appendChild(pay);
                    item.appendChild(met);
                    list.appendChild(item);
                });

                list.scrollTop = list.scrollHeight;
            }

            socket.on('new_broadcast', (data) => {
                if (data.protocol === 'all' || data.protocol === 'phosphor') {
                    data.isNew = true;
                    msgHistory.push(data);
                    if (msgHistory.length > 3) msgHistory.shift();
                    renderMessages();
                }
            });

            socket.on('history', (list) => {
                const relevant = list.filter(d => d.protocol === 'all' || d.protocol === 'phosphor');
                msgHistory = relevant.slice(-3);
                renderMessages();
            });
        })();
    </script>
