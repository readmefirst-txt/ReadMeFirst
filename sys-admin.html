<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS_ADMIN // OVERRIDE</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: monospace;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .admin-panel {
            background: rgba(0, 50, 0, 0.1);
            border: 1px solid #00ff41;
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px dashed #00ff41;
            padding-bottom: 15px;
            text-shadow: 0 0 5px #00ff41;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #000;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            background: #00ff41;
            color: #000;
            border: none;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            background: #fff;
        }

        #log {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #aaa;
            min-height: 20px;
        }

        /* DASHBOARD STYLES */
        .dashboard {
            margin-top: 40px;
            border-top: 2px solid #00ff41;
            padding-top: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            border: 1px solid #00ff41;
            padding: 15px;
            text-align: center;
        }

        .stat-val {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .detail-box {
            border: 1px solid #004400;
            padding: 10px;
            font-size: 0.8rem;
        }

        .detail-box h3 {
            font-size: 0.9rem;
            margin-top: 0;
            border-bottom: 1px solid #004400;
            padding-bottom: 5px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dotted #003300;
            padding: 4px 0;
        }
    </style>
</head>

<body>

    <div class="admin-panel">
        <h1>SYS_ADMIN // DUMP INJECTOR</h1>
        <div>
            <label>TARGET_NODE (Protocol)</label>
            <select id="protocol">
                <option value="all">ALL NODES (Broadcast)</option>
                <option value="classic">CLASSIC ONLY</option>
                <option value="phosphor">PHOSPHOR ONLY</option>
                <option value="horror">HORROR ONLY</option>
            </select>
        </div>

        <div>
            <label>PAYLOAD (Message Text)</label>
            <textarea id="msg" placeholder="Enter transmission data..."></textarea>
        </div>

        <div>
            <label>SYS_OVERRIDE CLARENCE CODE</label>
            <input type="password" id="pass" placeholder="Password...">
        </div>

        <button onclick="sendBroadcast()">TRANSMIT PAYLOAD</button>
        <button onclick="resetBroadcasts()" style="background: transparent; border: 1px solid red; color: red; margin-top: 10px;">RESET TRANSMISSIONS</button>
        <div id="log">STATUS: WAITING_FOR_INPUT...</div>

        <!-- DASHBOARD SECTION -->
        <div class="dashboard">
            <h1>LIVE_INTERACTION_METRICS</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-val" id="stat-active" style="color: #00ff41;">0</span>
                    <span class="stat-label">Live Sessions</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-logins">0</span>
                    <span class="stat-label">Lifetime Logins</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-clicks">0</span>
                    <span class="stat-label">Lifetime Clicks</span>
                </div>
            </div>

            <div class="details-grid">
                <div class="detail-box">
                    <h3>HISTORICAL_PAGE_VIEWS</h3>
                    <div id="page-views-list">LOADING_ALL_TIME_DATA...</div>
                </div>
                <div class="detail-box">
                    <h3>TOP_REGIONS</h3>
                    <div id="region-list">LOADING...</div>
                </div>
                <div class="detail-box">
                    <h3>DEVICE_TYPES</h3>
                    <div id="device-list">LOADING...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('admin_success', (res) => {
            document.getElementById('log').innerText = "STATUS: " + res.status;
            document.getElementById('log').style.color = "#00ff41";
            document.getElementById('msg').value = ""; // clear msg
        });

        socket.on('admin_error', (res) => {
            document.getElementById('log').innerText = "STATUS: " + res.error;
            document.getElementById('log').style.color = "red";
        });

        function sendBroadcast() {
            const pass = document.getElementById('pass').value.trim();
            const msg = document.getElementById('msg').value;
            const protocol = document.getElementById('protocol').value;

            if (!pass || !msg) {
                document.getElementById('log').innerText = "STATUS: MISSING PAYLOAD OR PASSWORD";
                document.getElementById('log').style.color = "yellow";
                return;
            }

            document.getElementById('log').innerText = "STATUS: TRANSMITTING...";
            document.getElementById('log').style.color = "#aaa";

            socket.emit('admin_broadcast', {
                password: pass,
                message: msg,
                protocol: protocol
            });
        }

        function resetBroadcasts() {
            const pass = document.getElementById('pass').value.trim();
            if (!pass) {
                document.getElementById('log').innerText = "STATUS: PASSWORD REQUIRED FOR RESET";
                document.getElementById('log').style.color = "yellow";
                return;
            }
            if (!confirm("ARE YOU SURE? This will clear history on all connected clients.")) return;
            
            socket.emit('admin_reset_broadcasts', { password: pass });
        }

        // --- NEW STATISTICS LOGIC ---
        socket.emit('admin_join');

        socket.on('stats_update', (stats) => {
            console.log("Stats Update:", stats);
            document.getElementById('stat-active').innerText = stats.activeSessions;
            document.getElementById('stat-logins').innerText = stats.logins;
            document.getElementById('stat-clicks').innerText = stats.clicks;

            // Render Page Views
            let pvHtml = '';
            for (const [page, count] of Object.entries(stats.pageViews)) {
                pvHtml += `<div class="stat-row"><span>${page}</span><span>${count}</span></div>`;
            }
            document.getElementById('page-views-list').innerHTML = pvHtml || 'NO DATA';

            // Render Regions
            let regHtml = '';
            const sortedRegions = Object.entries(stats.regions).sort((a, b) => b[1] - a[1]);
            for (const [region, count] of sortedRegions) {
                regHtml += `<div class="stat-row"><span>${region}</span><span>${count}</span></div>`;
            }
            document.getElementById('region-list').innerHTML = regHtml || 'NO DATA';

            // Render Devices
            let devHtml = '';
            for (const [dev, count] of Object.entries(stats.devices)) {
                devHtml += `<div class="stat-row"><span>${dev}</span><span>${count}</span></div>`;
            }
            document.getElementById('device-list').innerHTML = devHtml || 'NO DATA';
        });
    </script>

</body>

</html>
